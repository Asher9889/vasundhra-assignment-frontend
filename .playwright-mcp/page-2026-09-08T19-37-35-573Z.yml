          - paragraph [ref=f15e27]: A public window into climate, energy and power data published by the Vasudha Foundation.
        - generic [ref=f15e35]:
          - heading "Vasudha Foundation" [level=2] [ref=f15e36]
          - paragraph [ref=f15e37]: Vasudha Foundation is a research organisation working on climate change, energy and resource governance. This platform is a demonstration of the organisation's data visualization interface.
        - generic [ref=f15e38]:
          - generic [ref=f15e39]:
            - heading "What this is" [level=2] [ref=f15e40]
            - paragraph [ref=f15e41]: "The Vasudha Foundation Climate, Energy & Power Data Visualization Platform publishes interactive visualizations derived from climate, energy and power datasets. Every visualization here has passed a review workflow: an admin submits a dataset, the Super Admin reviews it, and only approved datasets are published."
          - generic [ref=f15e42]:
            - heading "Data & methodology" [level=2] [ref=f15e43]
            - paragraph [ref=f15e44]: Datasets are submitted as CSV files and classified by domain (Climate, Energy, Power) and template type (Latitude/Longitude, State-wise, Time-series). This demonstration interface uses sample data only and is not connected to the Vasudha Foundation data warehouse.
          - generic [ref=f15e45]:
            - heading "Access" [level=2] [ref=f15e46]
            - paragraph [ref=f15e47]: Published visualizations are freely accessible to the public. Dataset submission and moderation are reserved for authorised admins through the Admin Login.
